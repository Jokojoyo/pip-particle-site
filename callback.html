<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TikTok sign-in | Pip &amp; Particle Publisher</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#002070">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="site-header">
  <div class="container header-row">
    <a class="brand" href="index.html"><img src="icon-192.png" alt="" width="42" height="42"><span>Pip &amp; Particle</span></a>
    <nav class="nav" aria-label="Main">
      <a href="publisher.html">Publisher</a>
      <a href="privacy.html">Privacy</a>
    </nav>
  </div>
</header>

<main id="main" class="container section prose">
  <h1>TikTok authorization received</h1>
  <p id="msg">Copy the code below and paste it into the Publisher's TikTok sign-in window (<code>auth_tiktok.py</code>).</p>
  <textarea id="code" class="code-box" readonly aria-label="Authorization code"></textarea>
  <div class="actions">
    <button class="btn btn-primary" type="button" onclick="navigator.clipboard.writeText(document.getElementById('code').value)">Copy code</button>
  </div>
  <p class="muted mt-sm">This page only displays the code TikTok sends back after you sign in. It does not store or send it anywhere.</p>
</main>
<script>
var q=new URLSearchParams(location.search),c=q.get('code'),e=q.get('error');
document.getElementById('code').value=c||'';
if(e){document.getElementById('msg').textContent='TikTok returned an error: '+e+' - '+(q.get('error_description')||'');}
else if(!c){document.getElementById('msg').textContent='No code in the URL. Start again from auth_tiktok.py.';}
</script>
</body>
</html>
